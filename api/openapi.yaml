openapi: 3.0.3

info:
  title: GoEcho API
  version: 1.0.0
  description: |
    REST API for GoEcho messenger.

servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: Users
    description: User registration and profiles

paths:
  /api/v1/users:
    post:
      tags:
        - Users
      summary: Register a new user
      operationId: createUser
      description: |
        Creates a new user account.
        Password must never be returned in API responses.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: User successfully registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Username or email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/users/me:
    get:
      tags:
        - Users
      summary: Get current user profile
      operationId: getCurrentUser
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/users/{userID}:
    get:
      tags:
        - Users
      summary: Get public user profile
      operationId: getUserByID
      security:
        - BearerAuth: []
      parameters:
        - name: userID
          in: path
          required: true
          description: User UUID
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Public user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicUserResponse"
        "400":
          description: Invalid user ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    CreateUserRequest:
      type: object
      additionalProperties: false
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
          pattern: "^[a-zA-Z0-9_]+$"
          example: artem_dev
        email:
          type: string
          format: email
          maxLength: 254
          example: artem@example.com
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          writeOnly: true
          example: StrongPassword123

    UserResponse:
      type: object
      required:
        - id
        - username
        - email
        - created_at
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        username:
          type: string
          example: artem_dev
        email:
          type: string
          format: email
          example: artem@example.com
        created_at:
          type: string
          format: date-time
          readOnly: true
          example: "2026-10-21T12:00:00Z"

    PublicUserResponse:
      type: object
      required:
        - id
        - username
        - created_at
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        username:
          type: string
          example: artem_dev
        created_at:
          type: string
          format: date-time
          readOnly: true
          example: "2026-10-21T12:00:00Z"

    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: USER_ALREADY_EXISTS
        message:
          type: string
          example: Username or email already exists
